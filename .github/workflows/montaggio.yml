name: montaggio
on:
  repository_dispatch:
    types: [montaggio]
concurrency: montaggio
jobs:
  monta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: banco/requirements.txt
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-montserrat >/dev/null || sudo apt-get install -y -qq ffmpeg fonts-dejavu >/dev/null
          mkdir -p ~/.fonts && curl -sL -o ~/.fonts/Lora.ttf "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" || true
          fc-cache -f >/dev/null
          pip install -q -r banco/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Monta
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python banco/monta.py
